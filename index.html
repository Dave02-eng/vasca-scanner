<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scan-point Vasche</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f8ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a5276, #2980b9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            width: 90%;
            max-width: 500px;
        }
        .header h1 { font-size: 2rem; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 1rem; }
        .main-area {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .greeting {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .greeting.not-logged { font-size: 1.2rem; color: #856404; }
        .scan-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.3rem;
            border: 2px solid #2980b9;
            border-radius: 8px;
            outline: none;
            text-align: center;
        }
        .scan-input:focus { border-color: #1a5276; box-shadow: 0 0 8px rgba(41,128,185,0.3); }
        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 44px;
            transition: opacity 0.3s;
        }
        .feedback.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .feedback.info { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        .counter {
            margin-top: 20px;
            color: #6c757d;
            font-size: 0.95rem;
        }
        .footer {
            position: fixed;
            bottom: 10px;
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }
        .loading { text-align: center; color: #2980b9; font-size: 1.1rem; margin-top: 20px; }

        /* ─── ALLARME ────────────────────────────────────────────── */
        #alarm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 999999;
            align-items: center;
            justify-content: center;
            animation: flashBg 0.4s infinite alternate;
        }
        @keyframes flashBg {
            from { background: rgba(220, 53, 69, 0.95); }
            to   { background: rgba(255, 193, 7, 0.95); }
        }
        #alarm-box {
            background: white;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-4px, 2px) rotate(-1deg); }
            75% { transform: translate(4px, -2px) rotate(1deg); }
        }
        #alarm-box .siren {
            font-size: 4.5rem;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to   { transform: scale(1.2); }
        }
        #alarm-box h2 {
            color: #dc3545;
            font-size: 1.6rem;
            margin: 10px 0;
        }
        #alarm-box p {
            font-size: 1.05rem;
            color: #333;
            margin: 12px 0;
        }
        #alarm-box .scan-count {
            font-size: 2.2rem;
            font-weight: bold;
            color: #dc3545;
        }
        #alarm-box .scan-input {
            border-color: #dc3545;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 Scan-point Vasche</h1>
        <p>MXP5</p>
    </div>

    <!-- LOADING -->
    <div class="loading" id="loading-msg">Caricamento...</div>

    <!-- AREA UNICA: input sempre attivo, riconosce badge o etichetta pacco -->
    <div class="main-area" id="main-area" style="display:none;">
        <div class="greeting" id="greeting-text">Scansiona il badge o l'etichetta pacco</div>
        <input type="text" class="scan-input" id="unified-input" placeholder="Badge o etichetta..." autocomplete="off" autofocus>
        <div class="feedback" id="feedback-box"></div>
        <div class="counter" id="counter"></div>
    </div>

    <div class="footer" id="footer-text">MXP5 — Vasca Injection Tracker</div>

    <!-- ALLARME LOGIN MANCANTE -->
    <div id="alarm-overlay">
        <div id="alarm-box">
            <div class="siren">🚨</div>
            <h2>ATTENZIONE!</h2>
            <p>Hai scansionato <span class="scan-count" id="alarm-scan-count">0</span> pacchi<br>
            <b>senza esserti loggato!</b></p>
            <p>Spara il tuo badge per continuare:</p>
            <input type="text" class="scan-input" id="alarm-input" placeholder="Spara il badge qui..." autocomplete="off">
        </div>
    </div>

    <script>
        // ─── CONFIG ─────────────────────────────────────────────────────
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGCxERhIMskRiXUdNlGVZh1I2_Tr6gzU3gGiSNDR8bb7onlzX8Vifocd55qlehJFuCEQ/exec";
        const ALARM_THRESHOLD = 10;
        const AUTO_LOGOUT_MS = 90 * 60 * 1000; // 1h30

        // ─── STATE ──────────────────────────────────────────────────────
        let currentLogin = "";
        let currentName = "";
        let scanCount = 0;
        let anonScanCount = 0;
        let loginTime = 0;
        let badgeMap = {};
        let sendQueue = [];
        let alarmActive = false;
        let audioCtx = null;
        let sirenInterval = null;

        const mainInput = document.getElementById("unified-input");
        const alarmInput = document.getElementById("alarm-input");
        const feedbackBox = document.getElementById("feedback-box");

        // ─── SBLOCCO AUDIO AL PRIMO INPUT (pattern standard anti-autoplay) ──
        // Crea l'AudioContext alla primissima interazione (anche uno scan
        // qualsiasi), così è già "sveglio" quando serve davvero per l'allarme.
        function unlockAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume().then(() => {
                    console.log("[Audio] AudioContext stato dopo resume:", audioCtx.state);
                }).catch(e => console.warn("[Audio] resume() fallito:", e));
                console.log("[Audio] AudioContext creato, stato iniziale:", audioCtx.state);
            } catch (e) {
                console.error("[Audio] Impossibile creare AudioContext:", e);
            }
        }
        document.addEventListener("keydown", unlockAudio, { once: true });
        document.addEventListener("click", unlockAudio, { once: true });

        // ─── LOAD BADGES ────────────────────────────────────────────────
        fetch("badges.json")
            .then(r => r.json())
            .then(data => {
                badgeMap = data;
                document.getElementById("loading-msg").style.display = "none";
                document.getElementById("main-area").style.display = "block";

                // Ripristina sessione se esiste E non è scaduta
                const saved = sessionStorage.getItem("vasca_user");
                if (saved) {
                    const user = JSON.parse(saved);
                    const savedLoginTime = parseInt(sessionStorage.getItem("vasca_login_time") || "0");
                    if (Date.now() - savedLoginTime < AUTO_LOGOUT_MS) {
                        currentLogin = user.login;
                        currentName = user.name;
                        loginTime = savedLoginTime;
                    } else {
                        // Sessione scaduta: pulisci
                        sessionStorage.removeItem("vasca_user");
                        sessionStorage.removeItem("vasca_login_time");
                    }
                }
                scanCount = parseInt(sessionStorage.getItem("vasca_count") || "0");
                anonScanCount = parseInt(sessionStorage.getItem("vasca_anon_count") || "0");

                updateUI();
                focusActiveInput();

                // Se già in stato di allarme da sessione precedente, ri-mostralo
                if (!currentLogin && anonScanCount >= ALARM_THRESHOLD) {
                    showAlarm();
                }
            })
            .catch(err => {
                console.error("Errore caricamento badges:", err);
                document.getElementById("loading-msg").textContent = "❌ Errore caricamento dati";
            });

        // ─── GESTIONE INPUT UNIFICATO (badge o pacco, riconosciuto automaticamente) ──
        function handleScan(rawValue) {
            const value = rawValue.trim();
            if (!value) return;

            // ─── COMANDO LOGOUT MANUALE ─────────────────────────────
            if (value.toUpperCase() === "STOP") {
                if (currentLogin) {
                    performLogout("🚪 Logout effettuato. Rifai il login.");
                } else {
                    showFeedback("ℹ️ Non eri loggato.", "info");
                }
                focusActiveInput();
                return;
            }

            // Normalizza come possibile badge: solo cifre -> pad a 7
            const asBadge = /^\d+$/.test(value) ? value.padStart(7, "0") : value;

            if (badgeMap[asBadge]) {
                // ─── LOGIN (o cambio operatore) ───────────────────────
                currentLogin = badgeMap[asBadge].login;
                currentName = badgeMap[asBadge].name;
                anonScanCount = 0;
                loginTime = Date.now();
                sessionStorage.setItem("vasca_user", JSON.stringify({login: currentLogin, name: currentName}));
                sessionStorage.setItem("vasca_login_time", loginTime.toString());
                sessionStorage.setItem("vasca_anon_count", "0");

                let firstName = currentName;
                if (currentName.includes(",")) {
                    firstName = currentName.split(",")[1].trim().split(" ")[0];
                }
                showFeedback("✅ Ciao " + firstName + "!", "success");
                hideAlarm();
                updateUI();
                loginToFcMenuAndSetTask(value);
            } else {
                // ─── SCAN ETICHETTA PACCO ──────────────────────────────
                scanCount++;
                sessionStorage.setItem("vasca_count", scanCount.toString());
                showFeedback("✅ " + value, "success");
                sendToSheet(value);

                if (!currentLogin) {
                    anonScanCount++;
                    sessionStorage.setItem("vasca_anon_count", anonScanCount.toString());
                    if (anonScanCount >= ALARM_THRESHOLD) {
                        showAlarm();
                    }
                }
                updateCounter();
            }

            focusActiveInput();
        }

        function showFeedback(text, type) {
            feedbackBox.className = "feedback " + type;
            feedbackBox.textContent = text;
        }

        // ─── AGGIORNA UI (greeting, footer) ──────────────────────────────
        function updateUI() {
            const greeting = document.getElementById("greeting-text");
            const footer = document.getElementById("footer-text");

            if (currentLogin) {
                let firstName = currentName;
                if (currentName.includes(",")) {
                    firstName = currentName.split(",")[1].trim().split(" ")[0];
                }
                greeting.className = "greeting";
                greeting.textContent = "Ciao " + firstName + ", scansiona l'etichetta pacco";
                footer.textContent = "👤 " + currentLogin + " — MXP5 Vasca Injection Tracker";
            } else {
                greeting.className = "greeting not-logged";
                greeting.textContent = "Scansiona il badge o l'etichetta pacco";
                footer.textContent = "MXP5 — Vasca Injection Tracker · Non loggato (" + anonScanCount + "/" + ALARM_THRESHOLD + ")";
            }
            updateCounter();
        }

        function updateCounter() {
            document.getElementById("counter").textContent = scanCount + " scansion" + (scanCount === 1 ? "e" : "i") + " in questa sessione";
        }

        // ─── LOGOUT (condiviso: automatico o via scan "STOP") ───────────
        function performLogout(message) {
            currentLogin = "";
            currentName = "";
            loginTime = 0;
            anonScanCount = 0; // riparte il periodo di grazia dei 10 scan
            sessionStorage.removeItem("vasca_user");
            sessionStorage.removeItem("vasca_login_time");
            sessionStorage.setItem("vasca_anon_count", "0");
            showFeedback(message, "info");
            hideAlarm();
            updateUI();
        }

        // ─── AUTO-LOGOUT DOPO 1H30 ────────────────────────────────────
        function checkAutoLogout() {
            if (!currentLogin || !loginTime) return;
            if (Date.now() - loginTime >= AUTO_LOGOUT_MS) {
                performLogout("⏰ Sessione scaduta (1h30). Rifai il login.");
            }
        }
        setInterval(checkAutoLogout, 30000); // controlla ogni 30 secondi

        // ─── ALLARME ──────────────────────────────────────────────────
        function showAlarm() {
            alarmActive = true;
            document.getElementById("alarm-scan-count").textContent = anonScanCount;
            document.getElementById("alarm-overlay").style.display = "flex";
            alarmInput.value = "";
            alarmInput.focus();
            startSiren();
        }

        function hideAlarm() {
            if (!alarmActive) return;
            alarmActive = false;
            document.getElementById("alarm-overlay").style.display = "none";
            stopSiren();
        }

        function startSiren() {
            if (!audioCtx) unlockAudio(); // fallback se non era ancora stato creato
            if (!audioCtx) { console.error("[Audio] AudioContext non disponibile"); return; }
            if (sirenInterval) return; // già in corso

            console.log("[Audio] Avvio sirena, stato AudioContext:", audioCtx.state);
            if (audioCtx.state === "suspended") {
                audioCtx.resume().then(() => console.log("[Audio] Resumed, stato:", audioCtx.state));
            }

            let beepCount = 0;
            function beep() {
                beepCount++;
                console.log("[Audio] beep #" + beepCount + " — stato:", audioCtx.state, "currentTime:", audioCtx.currentTime.toFixed(2));
                if (audioCtx.state === "suspended") audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = "sine";
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1000, now + 0.3);
                osc.frequency.linearRampToValueAtTime(600, now + 0.6);
                gain.gain.setValueAtTime(0.4, now);
                osc.start(now);
                osc.stop(now + 0.6);
            }
            beep();
            sirenInterval = setInterval(beep, 700);
        }

        function stopSiren() {
            console.trace("[Audio] stopSiren chiamato");
            if (sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
            // Non chiudiamo audioCtx: resta pronto (già sbloccato) per il prossimo allarme
        }

        // ─── EVENT LISTENERS (input principale + input dentro l'allarme) ──
        mainInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                handleScan(this.value);
                this.value = "";
            }
        });

        alarmInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                handleScan(this.value);
                this.value = "";
            }
        });

        // ─── SEGNALA LOGIN A FC MENU (via Google Sheet) ──────────────────
        // Il POST diretto cross-site è bloccato da SameSite cookie policy +
        // X-Frame-Options. Soluzione: segnaliamo il login sullo stesso Sheet
        // che già usiamo; uno script Tampermonkey su FC Menu (same-origin,
        // nessun blocco) legge il segnale e fa login+set-task localmente.
        function signalFcMenuLogin(rawBadge) {
            const payload = {
                scannable_id: "BADGE_LOGIN_" + rawBadge,
                login: currentLogin
            };
            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                console.log("[FC Menu] Segnale login inviato allo Sheet:", rawBadge);
            }).catch(err => {
                console.warn("[FC Menu] Errore invio segnale login:", err);
            });
        }

        // ─── INVIO A GOOGLE SHEET (con retry) ───────────────────────────
        function sendToSheet(scannableId) {
            const payload = {
                scannable_id: scannableId,
                login: currentLogin || "ANONIMO"
            };

            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => {
                console.warn("Invio fallito, in coda per retry:", scannableId, err);
                sendQueue.push(payload);
            });
        }

        setInterval(() => {
            if (sendQueue.length === 0) return;
            const batch = [...sendQueue];
            sendQueue = [];
            batch.forEach(payload => {
                fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(() => {
                    sendQueue.push(payload);
                });
            });
        }, 30000);

        // ─── FOCUS SEMPRE ATTIVO (niente mouse/tastiera: serve auto-focus) ──
        function focusActiveInput() {
            if (alarmActive) {
                alarmInput.focus();
            } else {
                mainInput.focus();
            }
        }

        // Rimette il focus se per qualche motivo si perde (click accidentale, popup, ecc.)
        setInterval(focusActiveInput, 1000);
        document.addEventListener("click", focusActiveInput);
    </script>
</body>
</html>
